<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow mx-auto" style="max-width: 600px;">

        <h3 class="text-center mb-3">✏️ Edit Profile</h3>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-2">
                <label>Full Name</label>
                <input class="form-control" type="text" name="full_name" value="{{ profile.full_name }}">
            </div>

            <div class="mb-2">
                <label>Email</label>
                <input class="form-control" type="email" name="email" value="{{ user.email }}">
            </div>

            <div class="mb-2">
                <label>Class / Semester</label>
                <input class="form-control" type="text" name="student_class" value="{{ profile.student_class }}">
            </div>

            <div class="mb-2">
                <label>College</label>
                <input class="form-control" type="text" name="college" value="{{ profile.college }}">
            </div>

            <div class="mb-2">
                <label>Phone</label>
                <input class="form-control" type="text" name="phone" value="{{ profile.phone }}">
            </div>

            <button class="btn btn-primary w-100 mt-3">Save Changes</button>

        </form>

    </div>

</div>

</body>
</html>s
