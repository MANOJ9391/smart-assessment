<!DOCTYPE html>
<html>
<head>
    <title>ECE Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #f5f7fb; }

        .test-container {
            max-width: 700px;
            margin: auto;
        }

        .question-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .option {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .option:hover {
            background: #eef2ff;
        }

        input[type="radio"]:checked + label {
            background: #6366f1;
            color: white;
            padding: 10px;
            display: block;
            border-radius: 10px;
        }

        .timer {
            font-weight: bold;
            color: red;
        }
    </style>
</head>

<body>

<div class="container mt-5 test-container">

    <div class="d-flex justify-content-between mb-3">
        <h5>📘 ECE Test</h5>
        <div class="timer">⏱ <span id="time">60</span>s</div>
    </div>

    <form method="POST" action="/submit/" id="testForm">
        {% csrf_token %}

        {% for q in questions %}
        <div class="question-card mb-4 question" style="display:none;">

            <p class="fw-bold">Q{{ forloop.counter }}. {{ q.question_text }}</p>

            <!-- OPTION 1 -->
            <div class="option">
                <input class="d-none" type="radio" name="q{{ q.id }}" value="1" id="q{{ q.id }}o1">
                <label for="q{{ q.id }}o1">{{ q.option1 }}</label>
            </div>

            <!-- OPTION 2 -->
            <div class="option">
                <input class="d-none" type="radio" name="q{{ q.id }}" value="2" id="q{{ q.id }}o2">
                <label for="q{{ q.id }}o2">{{ q.option2 }}</label>
            </div>

            <!-- OPTION 3 -->
            <div class="option">
                <input class="d-none" type="radio" name="q{{ q.id }}" value="3" id="q{{ q.id }}o3">
                <label for="q{{ q.id }}o3">{{ q.option3 }}</label>
            </div>

            <!-- OPTION 4 -->
            <div class="option">
                <input class="d-none" type="radio" name="q{{ q.id }}" value="4" id="q{{ q.id }}o4">
                <label for="q{{ q.id }}o4">{{ q.option4 }}</label>
            </div>

        </div>
        {% endfor %}

        <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" onclick="prevQuestion()">Previous</button>
            <button type="button" class="btn btn-primary" onclick="nextQuestion()">Next</button>
        </div>

        <div class="text-center mt-4">
            <button type="button" onclick="submitForm()" class="btn btn-success px-5">
                Submit Test 🚀
            </button>
        </div>

    </form>

</div>

<script>
    let current = 0;
    const questions = document.querySelectorAll(".question");
    let time = 60;

    showQuestion(current);

    function showQuestion(i) {
        questions.forEach(q => q.style.display = "none");
        questions[i].style.display = "block";
        time = 60;
    }

    function nextQuestion() {
        if (current < questions.length - 1) {
            current++;
            showQuestion(current);
        } else {
            submitForm();
        }
    }

    function prevQuestion() {
        if (current > 0) {
            current--;
            showQuestion(current);
        }
    }

    function submitForm() {
        let answered = document.querySelectorAll("input[type='radio']:checked").length;

        if (answered === 0) {
            alert("Answer at least one question!");
            return;
        }

        document.getElementById("testForm").submit();
    }

    setInterval(() => {
        time--;
        document.getElementById("time").innerText = time;

        if (time <= 0) {
            nextQuestion();
        }
    }, 1000);
</script>

</body>
</html>
